name: Prepare Purple release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Purple version (X.Y.Z, e.g. 0.0.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-purple-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open release preparation PR
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out trunk and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Update versions and changelog
        run: node scripts/prepare-release.mjs "$VERSION"

      - name: Push release preparation branch
        run: |
          git switch -c "codex/prepare-purple-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add purple/style.css purple/readme.txt
          git commit -m "Prepare Purple $VERSION"
          git push origin "HEAD:refs/heads/codex/prepare-purple-$VERSION"

      - name: Open pull request
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ### Changes proposed in this Pull Request:

          Prepare Purple $VERSION by updating the theme version and stable tag, and adding merged PR titles since the previous release to the changelog.

          ### How to test the changes in this Pull Request:

          1. Confirm that Version in purple/style.css and Stable tag in purple/readme.txt are both $VERSION.
          2. Review the new changelog section against the PRs merged since the previous Purple tag. Edit the wording if needed.
          3. Approve the pending Theme CI workflow run on this bot-created PR and confirm all checks pass before merging.
          EOF
          gh pr create --base trunk --head "codex/prepare-purple-$VERSION" \
            --title "Prepare Purple $VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md"
